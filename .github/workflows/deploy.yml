name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 支持手动触发

concurrency:
  group: deploy-portal
  cancel-in-progress: false   # 部署不并发、不取消，排队执行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static portal via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ai-platform-portal
            echo "[INFO] git pull: $(date '+%F %T')"
            git pull origin main
            echo "[INFO] 校验 index.html"
            test -f index.html && echo "[INFO] index.html OK"

      - name: Health check (on server)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # 门户本体：静态目录，失败即部署失败
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H "Host: qiaokeshen.asia" http://127.0.0.1/)
            echo "HEALTH qiaokeshen.asia -> $code"
            case "$code" in 200|301|302) ;; *) echo "[ERROR] 门户异常: $code"; exit 1;; esac

            # 四个项目子域：门户 Tab 背后必须都是活的
            # 注意：内网 http 访问会 301 跳 https，判断不能写死 200（历史事故 run 34540128600）
            fail=0
            for h in rag sc cr lpr; do
              c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H "Host: $h.qiaokeshen.asia" http://127.0.0.1/ || true)
              if [ -z "$c" ]; then c="000"; fi
              echo "HEALTH $h.qiaokeshen.asia -> $c"
              case "$c" in 200|301|302) ;; *) fail=1;; esac
            done
            if [ "$fail" -ne 0 ]; then echo "[ERROR] 存在不可达的项目子域，请先排查再演示"; exit 1; fi
            echo "[INFO] 全部健康检查通过，部署完成"
